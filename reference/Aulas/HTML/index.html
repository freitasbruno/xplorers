        const lessonsGrid = document.getElementById('lessons-grid');
        const filterButtons = document.querySelectorAll('.filter-btn');

        // Função para renderizar os cartões na página
        function renderLessons(filteredLessons) {
            lessonsGrid.innerHTML = ''; // Limpa a grelha
            filteredLessons.forEach(lesson => {
                const card = document.createElement('div');
                card.className = 'card-container bg-white rounded-lg shadow-md overflow-hidden';
                card.innerHTML = `
                    <a href='${lesson.link}' class='block'>
                        <img class='w-full h-48 object-cover' src='${lesson.imagem}' alt='Imagem sobre ${lesson.tema}'>
                        <div class='p-5'>
                            <span class='inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full mb-2'>${lesson.tema}</span>
                            <h3 class='text-xl font-bold text-gray-900 mb-2'>${lesson.subtema}</h3>
                            <p class='text-gray-600 text-sm'>${lesson.descricao}</p>
                        </div>
                    </a>
                `;
                lessonsGrid.appendChild(card);
            });
        }
        
        // Função para gerir os filtros
        function filterLessons(filter) {
            let filtered;
            
            // Lógica do filtro
            if (filter === 'all') {
                filtered = lessonsData;
            } else if (filter === 'cosmos') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'Cosmos');
            } else if (filter === 'jogos') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'Jogos Olímpicos da Grécia Antiga');
            } else if (filter === 'sustentabilidade') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'Sustentabilidade');
            } else if (filter === 'empreendedorismo') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'Empreendedorismo');
            } else if (filter === 'historia-computadores') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'História dos Computadores');
            } else if (filter === 'videojogos') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'Videojogos');
            } else if (filter === 'historia-vida') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'História da Vida');
            } else if (filter === 'historia-volleyball') {
                filtered = lessonsData.filter(lesson => lesson.tema === 'História do Volleyball');
            }

            // Atualiza o estilo dos botões
            filterButtons.forEach(button => {
                if (button.id === `filter-${filter}`) {
                    button.classList.remove('bg-gray-200', 'text-gray-700');
                    button.classList.add('bg-blue-500', 'text-white');
                } else {
                    button.classList.add('bg-gray-200', 'text-gray-700');
                    button.classList.remove('bg-blue-500', 'text-white');
                }
            });

            renderLessons(filtered);
        }

        // Adiciona event listeners aos botões
        document.getElementById('filter-all').addEventListener('click', () => filterLessons('all'));
        document.getElementById('filter-cosmos').addEventListener('click', () => filterLessons('cosmos'));
        document.getElementById('filter-jogos').addEventListener('click', () => filterLessons('jogos'));
        document.getElementById('filter-sustentabilidade').addEventListener('click', () => filterLessons('sustentabilidade'));
        document.getElementById('filter-empreendedorismo').addEventListener('click', () => filterLessons('empreendedorismo'));
        document.getElementById('filter-historia-computadores').addEventListener('click', () => filterLessons('historia-computadores'));
        document.getElementById('filter-videojogos').addEventListener('click', () => filterLessons('videojogos'));
        document.getElementById('filter-historia-vida').addEventListener('click', () => filterLessons('historia-vida'));
        document.getElementById('filter-historia-volleyball').addEventListener('click', () => filterLessons('historia-volleyball'));

        // Renderização inicial
        renderLessons(lessonsData);

    </script>
</body>
</html>
